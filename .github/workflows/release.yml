# Publishes a GitHub release for each version: when the version (VERSION in src/version.js) or docs/releases/ changes on
# main, and that version has no release yet, it builds the simulator and creates the release v<version> with
# cosmic-events-<version>.html, the whole simulator in one file, ready to open offline (local copies offer it when they
# find a newer version). Its notes are docs/releases/<version>.md (English), followed by docs/releases/<version>.fr.md
# in a « En français » block when there is one. When the release already exists, its notes are kept in step with the files.
name: Release
on:
  push:
    branches: [main]
    paths: [src/version.js, 'docs/releases/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(node -e "console.log(require('fs').readFileSync('src/version.js','utf8').match(/VERSION\s*=\s*'([^']+)'/)[1])")" >> "$GITHUB_OUTPUT"
      - name: Notes
        run: |
          V="${{ steps.v.outputs.version }}"
          if [ -f "docs/releases/$V.md" ]; then cp "docs/releases/$V.md" /tmp/notes.md; else echo "Cosmic Events $V." > /tmp/notes.md; fi
          if [ -f "docs/releases/$V.fr.md" ]; then
            printf '\n\n<details><summary>En français</summary>\n\n' >> /tmp/notes.md
            cat "docs/releases/$V.fr.md" >> /tmp/notes.md
            printf '\n\n</details>\n' >> /tmp/notes.md
          fi
      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            gh release edit "v${{ steps.v.outputs.version }}" --notes-file /tmp/notes.md
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists != '1'
        with:
          node-version: 22
          cache: npm
      - name: Build and release
        if: steps.check.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          npm ci
          node tools/build.mjs
          cp dist/cosmic-events.html "cosmic-events-$V.html"
          gh release create "v$V" "cosmic-events-$V.html" --title "Cosmic Events $V" --notes-file /tmp/notes.md --target "$GITHUB_SHA" --latest
